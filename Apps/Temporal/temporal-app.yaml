apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: 'https://go.temporal.io/helm-charts'
    chart: temporal
    targetRevision: 1.6.0
    helm:
      valuesObject:
        server:
          replicaCount: 1
          config:
            persistence:
              defaultStore: default
              visibilityStore: visibility
              
              datastores:
                default:
                  sql:
                    createDatabase: true
                    manageSchema: true
                    pluginName: "mysql8"
                    driverName: "mysql8"
                    databaseName: "temporal"
                    connectAddr: "mysql.ecommerce.svc.cluster.local:3306"
                    connectProtocol: "tcp"
                    user: "root"
                    existingSecret: "mysql-admin-credentials"
                    secretKey: "admin-password"
                visibility:
                  sql:
                    createDatabase: true
                    manageSchema: true
                    pluginName: "mysql8"
                    driverName: "mysql8"
                    databaseName: "temporal_visibility"
                    connectAddr: "mysql.ecommerce.svc.cluster.local:3306"
                    connectProtocol: "tcp"
                    user: "root"
                    existingSecret: "mysql-admin-credentials"
                    secretKey: "admin-password"
        web:
          enabled: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true