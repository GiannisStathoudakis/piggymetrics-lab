apiVersion: external-secrets.io/v1 
kind: ExternalSecret
metadata:
  name: myql-admin-secret
  namespace: ecommerce
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: myql-admin-credentials
  data:
  - secretKey: admin-password
    remoteRef:
      key: secret/myql
      property: admin-password