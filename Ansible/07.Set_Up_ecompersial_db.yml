---
- hosts: master
  become: true
  vars_files:
    - files/cluster-keys.json
  
  vars:
    kubectl_cmd: "/var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml"
    microservices:
      - ms-orders
      - ms-payment
      - ms-stock

  tasks: 
    - name: 01. Enable Database Secrets Engine in Vault
      ansible.builtin.shell: >
        {{ kubectl_cmd }} exec -n vault vault-0 -- sh -c "export VAULT_TOKEN='$VAULT_TOKEN'; 
        vault secrets enable database"
      environment:
        VAULT_TOKEN: "{{ root_token }}"
      register: enable_db
      failed_when: "enable_db.rc != 0 and 'path is already in use' not in enable_db.stderr"
      changed_when: "enable_db.rc == 0"

    - name: 02. Configure MySQL connection in Vault
      ansible.builtin.shell: >
        {{ kubectl_cmd }} exec -n vault vault-0 -- sh -c "export VAULT_TOKEN='$VAULT_TOKEN'; 
        vault write database/config/ecommerce-mysql 
        plugin_name=mysql-database-plugin 
        allowed_roles='*' 
        connection_url='{% raw %}{{username}}:{{password}}{% endraw %}@tcp(mysql.ecommerce.svc.cluster.local:3306)/' 
        username='root' 
        password='password'"
      environment:
        VAULT_TOKEN: "{{ root_token }}"
      changed_when: false

    - name: 03. Rotate the MySQL Root Password
      ansible.builtin.shell: >
        {{ kubectl_cmd }} exec -n vault vault-0 -- sh -c "export VAULT_TOKEN='$VAULT_TOKEN'; 
        vault write -force database/rotate-root/ecommerce-mysql"
      environment:
        VAULT_TOKEN: "{{ root_token }}"
      ignore_errors: true

    - name: 04. Create Vault roles for microservices (MySQL Syntax)
      ansible.builtin.shell: >
        {{ kubectl_cmd }} exec -n vault vault-0 -- sh -c "export VAULT_TOKEN='$VAULT_TOKEN'; 
        vault write database/roles/{{ item }}-role 
        db_name=ecommerce-mysql 
        creation_statements=\"CREATE USER '{% raw %}{{name}}{% endraw %}'@'%' IDENTIFIED BY '{% raw %}{{password}}{% endraw %}'; GRANT ALL PRIVILEGES ON ecommerce.* TO '{% raw %}{{name}}{% endraw %}'@'%';\" 
        default_ttl='1h' 
        max_ttl='24h'"
      environment:
        VAULT_TOKEN: "{{ root_token }}"
      loop: "{{ microservices }}"
      changed_when: false

    - name: 05. Grant ESO API permissions for Database Creds
      ansible.builtin.shell: >
        {{ kubectl_cmd }} exec -n vault vault-0 -- sh -c "export VAULT_TOKEN='$VAULT_TOKEN'; 
        echo 'path \"secret/data/*\" { capabilities = [\"read\"] } path \"database/creds/*\" { capabilities = [\"read\"] }' | vault policy write eso-policy -"
      environment:
        VAULT_TOKEN: "{{ root_token }}"
      changed_when: true